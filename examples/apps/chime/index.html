<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Notification chime — demo app</title>
	<style>
		body { font-family: system-ui; max-width: 40rem; margin: 3rem auto; }
		button { font-size: 1rem; padding: 0.5rem 1.2rem; }
	</style>
</head>
<body>
	<h1>Inbox</h1>
	<button id="send">Send</button>
	<p id="status">ready</p>
	<audio id="chime"></audio>
	<script>
		// Render a 880Hz chime offline and give the <audio> element a real src.
		async function makeChime() {
			const rate = 16000, seconds = 1.5;
			const off = new OfflineAudioContext(1, rate * seconds, rate);
			const osc = off.createOscillator();
			osc.frequency.value = 880;
			const gain = off.createGain();
			gain.gain.value = 0.5;
			osc.connect(gain).connect(off.destination);
			osc.start();
			osc.stop(seconds);
			const buf = await off.startRendering();
			document.getElementById('chime').src = URL.createObjectURL(new Blob([toWav(buf)], { type: 'audio/wav' }));
		}

		function toWav(buf) {
			const data = buf.getChannelData(0);
			const out = new DataView(new ArrayBuffer(44 + data.length * 2));
			const str = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
			str(0, 'RIFF'); out.setUint32(4, 36 + data.length * 2, true); str(8, 'WAVEfmt ');
			out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 1, true);
			out.setUint32(24, buf.sampleRate, true); out.setUint32(28, buf.sampleRate * 2, true);
			out.setUint16(32, 2, true); out.setUint16(34, 16, true);
			str(36, 'data'); out.setUint32(40, data.length * 2, true);
			for (let i = 0; i < data.length; i++) out.setInt16(44 + i * 2, Math.max(-1, Math.min(1, data[i])) * 32767, true);
			return out.buffer;
		}

		makeChime();
		document.getElementById('send').addEventListener('click', () => {
			const chime = document.getElementById('chime');
			chime.currentTime = 0;
			chime.play();
			document.getElementById('status').textContent = 'message sent';
		});
	</script>
</body>
</html>
