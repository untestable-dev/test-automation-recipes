<!doctype html>
<html lang="ja">
<head>
	<meta charset="utf-8" />
	<title>Search — demo app</title>
	<style>
		body { font-family: system-ui; max-width: 40rem; margin: 3rem auto; }
		input { font-size: 1.1rem; padding: 0.4rem; width: 18rem; }
		#result { margin-top: 1rem; font-weight: bold; }
	</style>
</head>
<body>
	<h1>Search</h1>
	<form id="f">
		<input id="q" name="q" autocomplete="off" />
		<span id="count">0</span> chars
	</form>
	<div id="result"></div>
	<script>
		const q = document.getElementById('q');
		const count = document.getElementById('count');
		const result = document.getElementById('result');

		// Enter during IME composition confirms the candidate — it must never
		// submit the form. (isComposing; keyCode 229 for legacy engines.)
		q.addEventListener('keydown', (e) => {
			if (e.key === 'Enter' && (e.isComposing || e.keyCode === 229)) {
				e.preventDefault();
			}
		});

		// The counter must not count the preedit (unconfirmed) string.
		q.addEventListener('input', (e) => {
			if (!e.isComposing) count.textContent = q.value.length;
		});
		q.addEventListener('compositionend', () => {
			count.textContent = q.value.length;
		});

		document.getElementById('f').addEventListener('submit', (e) => {
			e.preventDefault();
			result.textContent = 'Searched: ' + q.value;
			history.pushState(null, '', '?q=' + encodeURIComponent(q.value));
		});
	</script>
</body>
</html>
