<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Editor with toasts — demo app</title>
	<style>
		body { font-family: system-ui; max-width: 40rem; margin: 3rem auto; }
		button { font-size: 1rem; padding: 0.5rem 1.2rem; }
		.toast {
			position: fixed; top: 16px; right: 16px;
			background: #16a34a; color: white; padding: 0.7rem 1.2rem;
			border-radius: 8px; font-weight: bold;
		}
	</style>
</head>
<body>
	<h1>Editor</h1>
	<textarea rows="4" cols="40">Some document text</textarea><br />
	<button id="save">Save</button>
	<script>
		document.getElementById('save').addEventListener('click', () => {
			// The toast appears a beat after the click and self-dismisses —
			// gone before a typical assertion gets to look at it.
			setTimeout(() => {
				const t = document.createElement('div');
				t.className = 'toast';
				t.textContent = 'Saved!';
				document.body.append(t);
				setTimeout(() => t.remove(), 1800);
			}, 300);
		});
	</script>
</body>
</html>
